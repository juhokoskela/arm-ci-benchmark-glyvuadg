name: Four-vCPU ARM comparison
run-name: ${{ inputs.provider }} ${{ inputs.phase }}
on:
  workflow_dispatch:
    inputs:
      provider:
        type: choice
        required: true
        options:
          - ubuntu-24.04-arm
          - avrea-ubuntu-24.04-arm-4-vcpu
          - blacksmith-4vcpu-ubuntu-2404-arm
      phase:
        type: choice
        required: true
        options: [prime, measure]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ${{ inputs.provider }}
    timeout-minutes: 12
    env:
      GLASSEQ_TEST_DATABASE_URL: postgres://glasseq:glasseq@127.0.0.1:5432/glasseq?sslmode=disable
    steps:
      - name: Verify four ARM vCPUs
        run: |
          set -eu
          echo "ARM_HOST arch=$(uname -m) vcpus=$(nproc) mem_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"
          test "$(uname -m)" = aarch64
          test "$(nproc)" = 4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: juhokoskela/GlassEQServer
          ref: 87cd5a17938c2b9b6036a4d37b0b583406989261
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        id: paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore Go caches
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ steps.paths.outputs.build }}
            ${{ steps.paths.outputs.modules }}
          key: glasseq-arm4-v1-${{ inputs.provider }}-87cd5a1
      - name: Record restored cache
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          PHASE: ${{ inputs.phase }}
        run: |
          files=0
          p=$(go env GOCACHE)
          if test -d "$p"; then files=$(find "$p" -type f | wc -l); fi
          echo "ARM_CACHE hit=${CACHE_HIT:-false} files=$files"
          if test "$PHASE" = measure; then
            test "$CACHE_HIT" = true
            test "$files" -gt 100
          fi
      - name: Prepare PostgreSQL
        run: |
          set -euo pipefail
          docker run -d --name pg -p 127.0.0.1:5432:5432 -e POSTGRES_USER=glasseq -e POSTGRES_PASSWORD=glasseq -e POSTGRES_DB=glasseq postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          for i in {1..30}; do docker exec pg pg_isready -U glasseq && break; sleep 1; done
          docker run --rm --network host -v "$GITHUB_WORKSPACE/migrations:/migrations:ro" -e GOOSE_DRIVER=postgres -e GOOSE_DBSTRING="$GLASSEQ_TEST_DATABASE_URL" juhokoskela/goose:v3.27.3@sha256:db4be381f2173bfd8994b9ca03e2fa2f8d7692ac3cef4aa5e2059db3e760cc3d up
      - name: Rebuild and compare workload
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 87cd5a17938c2b9b6036a4d37b0b583406989261
          go test -count=1 -p 1 -race -json ./... > "$RUNNER_TEMP/tests" || { tail -80 "$RUNNER_TEMP/tests"; exit 1; }
          go vet ./...
          go build -trimpath -buildvcs=false -ldflags=-buildid= -o "$RUNNER_TEMP/server" ./cmd/glasseqserver
          python3 -c 'import json,sys; print("\n".join(x["Package"]+"\t"+x["Test"] for x in map(json.loads,sys.stdin) if x.get("Action")=="pass" and x.get("Test")))' < "$RUNNER_TEMP/tests" | LC_ALL=C sort > "$RUNNER_TEMP/names"
          count=$(wc -l < "$RUNNER_TEMP/names")
          test "$count" -gt 350
          echo "CANARY_PROOF tests=$count suite=$(sha256sum "$RUNNER_TEMP/names" | cut -d' ' -f1) binary=$(sha256sum "$RUNNER_TEMP/server" | cut -d' ' -f1)"
